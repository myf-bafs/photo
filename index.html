<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自動辨識課表工具</title>
  <!-- 引入 Tesseract.js 進行免費 OCR 文字辨識 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #f4f4f7; max-width: 800px; margin: 0 auto; }
    .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { padding: 10px 15px; background: #007aff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #status { margin-top: 10px; color: #666; font-size: 14px; }
    textarea { width: 100%; height: 150px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h3>1. 上傳課表圖片自動辨識</h3>
  <input type="file" id="imgInput" accept="image/*">
  <br><br>
  <button onclick="scanImage()">自動掃描圖片文字</button>
  <div id="status"></div>
</div>

<div class="card">
  <h3>2. 掃描結果 (文字擷取)</h3>
  <textarea id="ocrResult" placeholder="辨識後的文字會顯示在這裡..."></textarea>
</div>

<script>
  async function scanImage() {
    const fileInput = document.getElementById('imgInput');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('ocrResult');

    if (!fileInput.files[0]) {
      alert('請先選擇圖片！');
      return;
    }

    status.innerText = '正在掃描圖片中，請稍候...';
    resultBox.value = '';

    try {
      const worker = await Tesseract.createWorker('chi_tra+eng'); // 支援繁體中文與英文
      const ret = await worker.recognize(fileInput.files[0]);
      resultBox.value = ret.data.text;
      status.innerText = '掃描完成！';
      await worker.terminate();
    } catch (err) {
      status.innerText = '辨識失敗：' + err.message;
    }
  }
</script>
</body>
</html>
